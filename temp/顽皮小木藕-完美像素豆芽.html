<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>顽皮小木藕 - 完美像素豆芽</title>
<style>
  body {
    background-color: #1a1b26;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; margin: 0; font-family: 'Fira Code', monospace;
  }

  /* --- 核心控制变量 --- */
  .mochi-wrapper {
    --spin-speed: 4s;
    --breathe-speed: 3s;
    --face-y: 0px; 
    --body-fill: #ffffff;
    
    /* 豆芽正常态颜色 */
    --leaf-1-fill: #d9f99d; /* 嫩黄绿 */
    --leaf-1-border: #4d7c0f; /* 深绿边 */
    --leaf-2-fill: #4ade80; /* 翠绿 */
    --leaf-2-border: #166534; /* 墨绿边 */
    
    position: relative; width: 250px; height: 300px;
  }

  /* --- 红温/过载态 --- */
  .is-overloaded {
    --spin-speed: 0.2s;
    --breathe-speed: 0.8s;
    --face-y: 15px;
    --body-fill: #ffcfd2;
    
    /* 豆芽红温：变成烧红的橙红色 */
    --leaf-1-fill: #fca5a5; --leaf-1-border: #991b1b;
    --leaf-2-fill: #ef4444; --leaf-2-border: #7f1d1d;
  }

  /* 动画组 */
  .body-group {
    animation: breathe var(--breathe-speed) ease-in-out infinite;
    transform-origin: bottom;
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.96) translateY(4px); }
  }

  .propeller-group {
    transform-origin: 125px 45px;
    animation: spin var(--spin-speed) linear infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* 像素蒸汽粒子 */
  @keyframes pixel-float {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 0.8; }
    100% { transform: translateY(-60px); opacity: 0; }
  }
  .steam {
    fill: #ffffff; opacity: 0;
    animation: pixel-float 1.5s infinite;
  }

  /* 丝滑过渡 */
  .transition-logic {
    transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  button {
    margin-top: 30px; background: #3b4261; border: 4px solid #565f89; color: #fff;
    padding: 12px 24px; cursor: pointer; font-family: inherit;
    image-rendering: pixelated;
  }
  button:hover { background: #7aa2f7; }
</style>
</head>
<body>

<div class="mochi-wrapper" id="mochi">
  <svg width="250" height="250" viewBox="0 0 250 250" shape-rendering="crispEdges">
    <!-- 像素蒸汽 (仅在过载时通过JS控制显示) -->
    <g id="steam-group" style="display: none;">
      <rect x="110" y="30" width="6" height="6" class="steam" style="animation-delay: 0s;"/>
      <rect x="135" y="15" width="8" height="8" class="steam" style="animation-delay: 0.5s;"/>
    </g>
    <g class="body-group">
      <!-- 🚀 精修像素豆芽 (手绘叶片风格) -->
      <g class="propeller-group">
        <!-- 豆芽根部 -->
        <rect x="122" y="42" width="6" height="4" fill="#3f6212"/>
        <!-- 上叶片 (嫩色) -->
        <g class="transition-logic">
          <!-- 勾边 -->
          <path d="M122 18h6v4h4v4h4v8h-4v4h-10v-4h-4v-8h4v-4h4z" fill="var(--leaf-1-border)" class="transition-logic"/>
          <!-- 填充 -->
          <path d="M124 22h2v4h4v8h-6v4h-6v-4h-2v-8h4v-4z" fill="var(--leaf-1-fill)" class="transition-logic"/>
        </g>
        <!-- 下叶片 (翠色 - 对称镜像) -->
        <g class="transition-logic">
          <!-- 勾边 -->
          <path d="M122 72h6v-4h4v-4h4v-8h-4v-4h-10v4h-4v8h4v4h4z" fill="var(--leaf-2-border)" class="transition-logic"/>
          <!-- 填充 -->
          <path d="M124 68h2v-4h4v-8h-6v-4h-6v4h-2v-8h4v4z" fill="var(--leaf-2-fill)" class="transition-logic"/>
        </g>
      </g>
      <!-- 像素身体 -->
      <path id="pixel-body" class="transition-logic"
            fill="var(--body-fill)"
            d="M 90 70 H 160 V 76 H 170 V 82 H 180 V 160 H 170 V 170 H 160 V 180 H 90 V 170 H 80 V 160 H 70 V 82 H 80 V 76 H 90 Z" />
      <!-- 脸部细节 -->
      <g style="transform: translateY(var(--face-y));" class="transition-logic">
        <!-- 默认像素脸 -->
        <g fill="#444">
          <rect x="90" y="105" width="4" height="4"/><rect x="94" y="101" width="4" height="4"/><rect x="98" y="105" width="4" height="4"/>
          <rect x="148" y="105" width="4" height="4"/><rect x="152" y="101" width="4" height="4"/><rect x="156" y="105" width="4" height="4"/>
          <rect x="116" y="122" width="16" height="4"/> <!-- 简单的小嘴 -->
        </g>
        <!-- 腮红 -->
        <rect x="75" y="125" width="12" height="4" fill="#ffb6c1" style="opacity: var(--face-y);"/>
        <rect x="163" y="125" width="12" height="4" fill="#ffb6c1" style="opacity: var(--face-y);"/>
      </g>
    </g>
  </svg>
</div>

<button id="toggleBtn" onclick="toggleState()">运行大项目 (看这个豆芽！)</button>

<script>
  function toggleState() {
    const mochi = document.getElementById('mochi');
    const steam = document.getElementById('steam-group');
    const body = document.getElementById('pixel-body');
    const btn = document.getElementById('toggleBtn');
    
    mochi.classList.toggle('is-overloaded');
    
    if (mochi.classList.contains('is-overloaded')) {
      steam.style.display = 'block';
      body.setAttribute('d', 'M 90 90 H 160 V 96 H 185 V 105 H 205 V 195 H 180 V 210 H 70 V 195 H 45 V 105 H 65 V 96 H 90 Z');
      btn.innerText = '任务完成 (冷却降温)';
    } else {
      steam.style.display = 'none';
      body.setAttribute('d', 'M 90 70 H 160 V 76 H 170 V 82 H 180 V 160 H 170 V 170 H 160 V 180 H 90 V 170 H 80 V 160 H 70 V 82 H 80 V 76 H 90 Z');
      btn.innerText = '运行大项目 (看这个豆芽！)';
    }
  }
</script>

</body>
</html>
